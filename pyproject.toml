# Paquete «bulonator-nucleo»: el núcleo sin dependencias (lo que usa el plugin de Claude Code).
# El motor es el paquete «bulonator», en motor/pyproject.toml, que depende de este.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bulonator-nucleo"
dynamic = ["version"]
description = "Núcleo de Bulonator sin dependencias: captura, fuentes oficiales (BOE, INE), análisis multimedia, registro de fuentes y validación de casos de verificación de bulos."
readme = "docs/pypi/bulonator-nucleo.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Bernardo Botella" }]
keywords = ["fact-checking", "verificación", "bulos", "desinformación", "boe", "ine", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
# Solo la biblioteca estándar: el plugin de Claude Code funciona sin instalar nada.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]

[project.scripts]
bulonator = "bulonator.cli:main"

[project.urls]
Homepage = "https://github.com/bbotella/bulonator"
Documentation = "https://github.com/bbotella/bulonator#readme"
Issues = "https://github.com/bbotella/bulonator/issues"

[tool.hatch.version]
path = "src/bulonator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bulonator"]

# La metodología tiene una sola copia (la del plugin); la rueda la incluye para el núcleo y el motor.
[tool.hatch.build.targets.wheel.force-include]
"skills/bulonator/references" = "bulonator/_datos/references"
"skills/bulonator/templates" = "bulonator/_datos/templates"
"agents" = "bulonator/_datos/agents"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "agents", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py39"
