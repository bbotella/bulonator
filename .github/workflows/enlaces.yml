name: Enlaces de las referencias

on:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/bulonator/references/**"
      - "docs/**"
      - "README.md"

jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Comprobar enlaces (falla solo con enlaces rotos: 404 o DNS)"
        run: python tests/check_links.py skills/bulonator/references/*.md docs/*.md README.md
