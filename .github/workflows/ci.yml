name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo y plugin (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -m compileall -q src tests skills/bulonator/scripts
      - name: Pruebas del núcleo, la metodología y la estructura (las del motor se omiten sin pydantic-ai)
        run: python -m unittest discover -s tests -v
      - name: Comprobar install.sh para Claude Code
        run: |
          bash -n install.sh
          ./install.sh --dest "$RUNNER_TEMP/claude"
          test -f "$RUNNER_TEMP/claude/skills/bulonator/SKILL.md"
          test -f "$RUNNER_TEMP/claude/skills/bulonator/scripts/_vendor/bulonator/cli.py"
          test -f "$RUNNER_TEMP/claude/agents/bulonator-auditor.md"
          python "$RUNNER_TEMP/claude/skills/bulonator/scripts/bulonator.py" --version
          ./install.sh --uninstall --dest "$RUNNER_TEMP/claude"

  motor:
    name: Motor (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar con los extras del motor
        run: python -m pip install -e ".[motor,evals]"
      - name: Todas las pruebas, incluidas las del motor (con modelos simulados, sin red)
        run: python -m unittest discover -s tests -v
      - name: Construir la rueda y comprobar que lleva la metodología
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m zipfile -l dist/bulonator-*.whl | grep -q "bulonator/_datos/references/reglas.json"
          python -m zipfile -l dist/bulonator-*.whl | grep -q "bulonator/_datos/agents/bulonator-auditor.md"
          python -m venv "$RUNNER_TEMP/rueda"
          "$RUNNER_TEMP/rueda/bin/pip" install -q dist/bulonator-*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/rueda/bin/python" -c "from bulonator.nucleo import metodologia; m = metodologia(); assert '_datos' in str(m.referencias), m; print(m)"

  install-motor:
    name: install.sh --solo-motor (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar y probar la orden bulonator
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          ./install.sh --solo-motor
          "$UV_TOOL_BIN_DIR/bulonator" --version
          "$UV_TOOL_BIN_DIR/bulonator" analizar --help

  validar-plugin:
    name: Validar el plugin con Claude Code
    runs-on: ubuntu-latest
    # No bloquea la fusión: depende de la versión publicada de la CLI de Claude Code
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate skills
      - run: claude plugin validate agents
